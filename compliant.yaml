# Namespace + Pod tuân thủ Pod Security Standards "Restricted" + có
# NetworkPolicy default-deny, dùng để test false positive: scanner không
# nên gắn cờ vi phạm nào cho các resource trong namespace này.

apiVersion: v1
kind: Namespace
metadata:
  name: compliant-test
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: compliant-test
type: Opaque
stringData:
  password: supersecretpassword123
---
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: compliant-test
  labels:
    app: compliant
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: compliant-container
      # Bản nginx build riêng để chạy non-root (listen port 8080 thay vì 80,
      # không cần bind privileged port) - image nginx thường sẽ crash khi
      # ép chạy non-root + readOnlyRootFilesystem như bên dưới.
      image: nginxinc/nginx-unprivileged:1.27.0
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
      ports:
        - containerPort: 8080
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
      volumeMounts:
        # nginx cần ghi vào các thư mục này lúc chạy - vì rootfs readonly
        # nên phải mount riêng bằng emptyDir (không ảnh hưởng gì tới các
        # control PSS Restricted đang test).
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
  volumes:
    - name: tmp
      emptyDir: {}
    - name: cache
      emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: compliant-test
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
